name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q NavidTranslate-Android.zip
      - name: Download OCR language data
        run: |
          cd NavidTranslate/app/src/main/assets/tessdata
          for l in fas ara urd pus eng; do
            curl -fsSL -o $l.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata
          done
      - name: Build debug APK
        working-directory: NavidTranslate
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NavidTranslate-APK
          path: NavidTranslate/app/build/outputs/apk/debug/app-debug.apk
